<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>حضور و غیاب سنترها</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eaf1fb;--card:#fff;--tx:#0f2440;--mut:#56708f;--bd:#cfdcee;--pri:#1554c0;--pri-tx:#fff;--hd:#0b3a8c;--p:#137a4a;--pb:#dff3e8;--a:#b3261e;--ab:#fbe4e2;--h:#8a5a00;--hb:#fdf0d2;--n:#5d7079;--nb:#e6ecef;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1728;--card:#12233b;--tx:#e7effa;--mut:#9db3cf;--bd:#26405f;--pri:#5b9bff;--pri-tx:#06152b;--hd:#16345f;--p:#6fd6a0;--pb:#173a2a;--a:#ff9b93;--ab:#452120;--h:#f2c366;--hb:#42320d;--n:#9bb0b8;--nb:#22343c}}
:root[data-theme="dark"]{--bg:#0b1728;--card:#12233b;--tx:#e7effa;--mut:#9db3cf;--bd:#26405f;--pri:#5b9bff;--pri-tx:#06152b;--hd:#16345f;--p:#6fd6a0;--pb:#173a2a;--a:#ff9b93;--ab:#452120;--h:#f2c366;--hb:#42320d;--n:#9bb0b8;--nb:#22343c}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Vazirmatn,Tahoma,sans-serif;line-height:1.7}
.wrap{max-width:960px;margin:0 auto;padding:16px}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:14px;background:var(--hd);color:#fff;border-radius:12px;padding:12px 16px}.brand{display:flex;align-items:center;gap:10px}header .btn.ghost{color:#fff;border-color:#fff}
h1{font-size:1.15rem;margin:0}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;border-top:3px solid var(--pri);padding:14px;margin-bottom:12px}
button,select,input{font:inherit;color:var(--tx)}
select,input[type=time]{background:var(--card);border:1px solid var(--bd);border-radius:6px;padding:4px 8px}
.btn{background:var(--pri);color:var(--pri-tx);border:0;border-radius:8px;padding:8px 16px;cursor:pointer;font-weight:600}
.btn.ghost{background:transparent;color:var(--pri);border:1px solid var(--pri)}
:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.title{font-weight:700;font-size:1.05rem;margin:8px 0}
.chip{display:inline-block;padding:1px 10px;border-radius:99px;font-size:.85rem;font-weight:600}
.s-p{color:var(--p);background:var(--pb)}.s-a{color:var(--a);background:var(--ab)}.s-h{color:var(--h);background:var(--hb)}.s-n{color:var(--n);background:var(--nb)}
.seg{display:inline-flex;border:1px solid var(--bd);border-radius:8px;overflow:hidden}
.seg button{background:transparent;border:0;padding:4px 12px;cursor:pointer}
.seg button.on{background:var(--pri);color:var(--pri-tx)}
.row{padding:10px 0;border-top:1px solid var(--bd)}
.row:first-child{border-top:0}
.rh{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.slots{margin-top:8px;padding:8px;background:var(--bg);border-radius:8px}
.slot{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
.err{color:var(--a);background:var(--ab);padding:8px 12px;border-radius:8px;margin-top:8px}
.ok{color:var(--p);background:var(--pb);padding:8px 12px;border-radius:8px;margin-top:8px}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:560px}
th,td{text-align:right;padding:8px;border-bottom:1px solid var(--bd)}
th{color:var(--mut);font-weight:600;font-size:.9rem}
.mut{color:var(--mut);font-size:.9rem}
.login{max-width:420px;margin:8vh auto}
body.lg{background:linear-gradient(135deg,#bfe0ff 0%,#eaf3ff 45%,#fde8f1 100%);min-height:100vh}
.lc{max-width:440px;margin:7vh auto 0;background:var(--card);border:1px solid var(--bd);border-radius:24px;padding:34px 40px 40px;box-shadow:0 18px 50px rgba(21,84,192,.15)}
.lt{text-align:center;font-size:1.3rem;margin:18px 0 6px}.ls{text-align:center;color:var(--mut);margin:0 0 24px}
.lc label{display:block;font-weight:600;font-size:.9rem;color:var(--mut);margin:14px 0 6px}
.lc input{width:100%;height:50px;border-radius:12px;border:1px solid #8fd0f5;background:#e3f0ff;padding:0 16px;font-size:1rem;text-align:right}
.lb{width:100%;height:50px;margin-top:22px;border:0;border-radius:12px;color:#fff;font-weight:700;font-size:1rem;cursor:pointer;background:linear-gradient(90deg,#6cc4ff,#6b93ff);box-shadow:0 10px 24px rgba(107,147,255,.4)}
.lb:disabled{opacity:.6;cursor:default}.lerr:empty{display:none}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) body.lg{background:linear-gradient(135deg,#0b1f3d,#0b1728 55%,#1f1830)}:root:not([data-theme="light"]) .lc input{background:var(--bg);border-color:var(--bd)}}
:root[data-theme="dark"] body.lg{background:linear-gradient(135deg,#0b1f3d,#0b1728 55%,#1f1830)}:root[data-theme="dark"] .lc input{background:var(--bg);border-color:var(--bd)}
@media (max-width:480px){.lc{margin:3vh 12px 0;padding:26px 22px 30px}}
.bn{display:block;font-weight:700;font-size:1.15rem;letter-spacing:.3px}.bs{display:block;font-size:.85rem;opacity:.85;font-weight:400}
.hero{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--bd);border-top:3px solid var(--pri);border-radius:10px;padding:8px 14px;margin-bottom:12px}.hero img{width:130px;max-width:38%;height:auto;flex:none}.hero .bn{color:var(--pri);font-size:1.7rem}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;max-width:360px;margin:10px 0}.wd{text-align:center;color:var(--mut);font-size:.85rem}.day{border:1px solid var(--bd);background:var(--card);border-radius:6px;padding:4px 0;cursor:pointer}.day.red{color:var(--a);background:var(--ab);border-color:var(--a)}.day.sel{outline:2px solid var(--pri);outline-offset:1px}.redtx{color:var(--a)}.s-l{color:var(--pri);background:var(--nb);border:1px solid var(--pri)}.s-x{color:var(--tx);background:var(--bd);border:1px solid var(--tx)}
</style>
</head>

    while(Q.length){

      try{r=await api({action:'op',op})}catch(e){throw e}
      if(!r.ok){op.n=(op.n||0)+1;if(op.n>5){console.error('drop op',r.error,op);Q.shift();saveQ();continue}saveQ();throw new Error(r.error)}
      Q.shift();saveQ();

    const seg=['p','a','h'].map(s=>`<button class="${e.s===s?'on':''}" onclick="setSt(${u.id},'${s}')">${ST[s]}</button>`).join('');
    let sl='';
    if(e.s==='h')sl=`<div class="slots"><div class="mut">ساعاتی که فرد حاضر است (داخل شیفت ${sh.n})</div>${e.slots.map((x,i)=>`<div class="slot">از <input type="time" value="${x[0]}" onchange="setSlot(${u.id},${i},0,this.value)"> تا <input type="time" value="${x[1]}" onchange="setSlot(${u.id},${i},1,this.value)"><button class="btn ghost" onclick="delSlot(${u.id},${i})">حذف</button></div>`).join('')}<button class="btn ghost" onclick="addSlot(${u.id})">افزودن بازه</button></div>`;
    return`<div class="row"><div class="rh"><div><b>${u.name}</b> <span class="mut">شیفت ${sh.n}</span></div><div class="seg" role="group">${seg}</div></div>${sl}</div>`}).join('');
  const ind='<div class="bar" style="margin:8px 0">'+pools(S.cid,S.draft).map(p=>`<span class="chip ${p.act>=p.need?'s-p':'s-a'}">شیفت ${p.nm}: ${fa(p.act)} فعال از ${fa(p.n)} (حداقل ${fa(p.need)})</span>`).join('')+'</div>'+(off(S.date.y,S.date.m,S.date.d)?'<p class="redtx">این روز جمعه یا تعطیل رسمی است؛ حداقل ۳۰٪ افراد هر شیفت باید فعال بمانند.</p>':'');
  const m=S.msg?(S.msg.e?`<div class="err">${S.msg.e.join('<br>')}</div>`:`<div class="ok">${S.msg.ok}</div>`):'';
  return`<div class="card"><b>سنتر ${c.name}</b>${dateBar()}${ind}<p class="mut">پیش‌فرض همه «حضور» است؛ فقط استثناها را تغییر دهید.</p>${rows}${m}<p><button class="btn" onclick="submit()">${rec(S.cid)?'ذخیرهٔ تغییرات':'ثبت حضور و غیاب'}</button></p></div>`;
}
function setF(k,v){S.f[k]=v;render()}
function adminView(){
  const f=S.f,cn=id=>db.centers.find(c=>c.id===id).name,cs=S.role==='team'?db.centers.filter(c=>c.t===S.team):db.centers,us=db.users.filter(u=>cs.some(c=>c.id===u.c)),ct=id=>db.centers.find(c=>c.id===id).t;
  const list=us.filter(u=>(!f.c||u.c==+f.c)&&(!f.t||ct(u.c)==+f.t)&&(!f.s||u.shift===f.s)).map(u=>{
    const r=rec(u.c),e=r&&r.entries[u.id],sp=susp(u.id),s=sp?'x':leaveOn(u.id)?'l':(e?(e.s==='x'||e.s==='l'?'p':e.s):'n');return{u,s,e,sp}}).filter(x=>!f.st||x.s===f.st);
  const cnt={p:0,a:0,h:0,n:0,x:0,l:0};list.forEach(x=>cnt[x.s]++);
  const sub=cs.filter(c=>rec(c.id)&&!rec(c.id).closed).length;const lkHtml=`<details style="margin-bottom:10px"><summary>قفل ثبت‌ها (روز انتخاب‌شده)</summary>${cs.map(c=>{const r=rec(c.id),L=r&&!r.unlocked;return`<div class="bar" style="margin-top:6px"><span>${c.name}</span><span class="chip ${L?'s-x':r?'s-p':'s-n'}">${L?(r.closed?'بسته‌شده':'قفل'):r?'باز برای ویرایش':'ثبت نشده'}</span><button class="btn ghost" onclick="${L?'unlock':'lock'}(${c.id})">${L?'باز کردن قفل':'قفل کردن'}</button></div>`}).join('')}</details>`;
  const se=S.se||{y:S.date.y,m:S.date.m,d:S.date.d},so=(n,a,b,fmt)=>{let q='';for(let i=a;i<=b;i++)q+=`<option value="${i}" ${i===n?'selected':''}>${fmt(i)}</option>`;return q},serr=S.lm&&S.lm.k==='s'?`<div class="err">${S.lm.m}</div>`:'';
  const spl=db.susp.filter(x=>x.t>=jd()-30&&us.some(u=>u.id===x.u)).map(x=>{const u=db.users.find(v=>v.id===x.u);return`<div class="bar" style="margin-top:6px"><span>${u.name} (${cn(u.c)}): ${x.t>x.f?'از '+dl(x.f)+' تا '+dl(x.t):dl(x.f)}</span><button class="btn ghost" onclick="delSusp(${x.i})">لغو</button></div>`}).join('');
  const spHtml=`<div class="card"><b>تعلیق کاربر</b><p class="mut">شروع تعلیق همان روز انتخاب‌شده در تقویم است؛ تاریخ پایان را وارد کنید. روزهای گذشته قابل انتخاب نیست.</p><div class="bar"><select id="su" aria-label="کاربر">${us.map(u=>`<option value="${u.id}">${u.name} – ${cn(u.c)}</option>`).join('')}</select><span>از ${dl(jd())} تا</span><select id="sd" aria-label="روز پایان" onchange="setSe()">${so(se.d,1,31,fa)}</select><select id="sm" aria-label="ماه پایان" onchange="setSe()">${so(se.m,1,12,i=>MONTHS[i-1])}</select><select id="sy" aria-label="سال پایان" onchange="setSe()">${so(se.y,1404,1410,fa)}</select><button class="btn" onclick="addSusp()">ثبت تعلیق</button></div>${serr}${spl}</div>`;
  const opt=(arr,v)=>arr.map(a=>`<option value="${a[0]}" ${String(v)===String(a[0])?'selected':''}>${a[1]}</option>`).join('');
  const rows=list.map(({u,s,e,sp})=>`<tr><td>${u.name}</td><td>${cn(u.c)}</td><td>${SHIFTS[u.shift].n}</td><td><span class="chip s-${s}">${ST[s]}</span></td><td>${s==='h'?hours(e.slots):s==='x'?'تا '+dl(sp.t):'–'}</td><td>${db.outs.filter(x=>x.c===u.c&&x.d===key()).map(x=>fa(x.f)+' تا '+fa(x.t)).join(' – ')||'–'}</td></tr>`).join('')||'<tr><td colspan="6" class="mut">موردی با این فیلترها نیست.</td></tr>';
  return`<div class="card">${dateBar()}<p class="mut">${fa(sub)} از ${fa(cs.length)} سنتر حضور و غیاب این روز را ثبت کرده‌اند.</p>
  <div class="bar" style="margin-bottom:10px"><span class="chip s-p">حضور: ${fa(cnt.p)}</span><span class="chip s-h">مرخصی ساعتی: ${fa(cnt.h)}</span><span class="chip s-a">اف: ${fa(cnt.a)}</span><span class="chip s-n">ثبت نشده: ${fa(cnt.n)}</span><span class="chip s-x">تعلیق: ${fa(cnt.x)}</span><span class="chip s-l">مرخصی: ${fa(cnt.l)}</span></div>
  <div class="bar" style="margin-bottom:10px">${S.role==='admin'?`<select aria-label="تیم" onchange="setF('t',this.value)"><option value="">همهٔ تیم‌ها</option>${opt([[1,'تیم ۱'],[2,'تیم ۲'],[3,'تیم ۳']],f.t)}</select>`:''}<select aria-label="سنتر" onchange="setF('c',this.value)"><option value="">همهٔ سنترها</option>${opt(cs.map(c=>[c.id,c.name]),f.c)}</select>
  <select aria-label="شیفت" onchange="setF('s',this.value)"><option value="">همهٔ شیفت‌ها</option>${opt([['m','صبح'],['n','شب']],f.s)}</select>
  <select aria-label="وضعیت" onchange="setF('st',this.value)"><option value="">همهٔ وضعیت‌ها</option>${opt(Object.entries(ST),f.st)}</select></div>
  ${lkHtml}<div class="tw"><table><thead><tr><th>کاربر</th><th>سنتر</th><th>شیفت</th><th>وضعیت</th><th>ساعات حضور</th><th>قطعی برق</th></tr></thead><tbody>${rows}</tbody></table></div></div>${leaveCardA(us)}${spHtml}${outCard('a',cs)}`;
}
function render(){
  const a=document.getElementById('app');document.body.classList.toggle('lg',!S.role);
  if(!S.role){a.innerHTML=login();return}
  a.innerHTML=`<header><div class="brand">${SHIELD(28,'#fff')}<h1>${S.role==='admin'?'پنل مدیر':S.role==='team'?'پنل سرگروه تیم '+fa(S.team):'ثبت حضور و غیاب'}</h1><span id="nb" class="bs">${nbText()}</span></div><button class="btn ghost" onclick="out()">خروج</button></header>${S.role==='center'?centerView()+leaveCardC()+outCard('c',db.centers.filter(c=>c.id===S.cid)):adminView()}`;
}
boot();
</script>
</body>
</html>
